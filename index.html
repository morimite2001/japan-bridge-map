<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全国 橋梁点検マップ（DPF連携）</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif; background: #0f172a; }
    #map { width: 100%; height: 100%; cursor: crosshair; }

    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 340px;
      max-width: calc(100vw - 24px);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 14px;
      border-radius: 14px;
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }
    .panel-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .panel-title { font-size: 16px; font-weight: 800; color: #38bdf8; margin: 0; display: flex; align-items: center; gap: 6px; }
    .toggle-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    .panel-body { margin-top: 10px; }
    .panel-body.collapsed { display: none; }

    .btn-gps {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .style-switcher { display: flex; gap: 6px; margin-bottom: 10px; }
    .style-btn { flex: 1; padding: 6px 4px; font-size: 11px; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .style-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .status-text { font-size: 12px; color: #e2e8f0; line-height: 1.45; margin-bottom: 10px; background: rgba(30, 41, 59, 0.75); padding: 8px 10px; border-radius: 6px; }
    .legend { display: flex; gap: 5px; flex-wrap: wrap; font-size: 11px; border-top: 1px solid #334155; padding-top: 8px; }
    .badge { padding: 3px 7px; border-radius: 4px; font-weight: bold; color: #fff; }
    .b-3 { background: #ef4444; }
    .b-2 { background: #f59e0b; }
    .b-1 { background: #10b981; }

    .maplibregl-popup { max-width: 345px !important; z-index: 30; }
    .maplibregl-popup-content {
      padding: 14px !important;
      border-radius: 12px !important;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      box-sizing: border-box;
      width: 320px;
      max-width: calc(100vw - 28px);
      max-height: 78vh;
      overflow-y: auto;
    }
    .maplibregl-popup-close-button { font-size: 20px; padding: 4px 8px; color: #475569; }
    .popup-title { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; padding-bottom: 5px; padding-right: 18px; border-bottom: 3px solid #ef4444; color: #0f172a; word-break: break-all; }
    .popup-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    .popup-table th, .popup-table td { border: 1px solid #cbd5e1; padding: 5px 6px; text-align: left; word-break: break-all; overflow-wrap: break-word; vertical-align: top; }
    .popup-table th { background: #f1f5f9; width: 38%; color: #334155; font-weight: 600; }
    .popup-table td { width: 62%; color: #0f172a; }

    .type-switcher { display: flex; gap: 6px; margin-top: 10px; }
    .type-btn { flex: 1; padding: 9px 4px; font-size: 13px; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .type-btn.active { background: #f8fafc; color: #0f172a; border-color: #f8fafc; }
  </style>
</head>
<body>
<div class="control-panel">
  <div class="panel-header" onclick="togglePanel()">
    <div class="panel-title"><span id="panel-title-text">🌉 全国 橋梁点検マップ</span></div>
    <button id="toggle-btn" class="toggle-btn">ー 最小化</button>
  </div>

  <!-- 施設種別の切替（パネルを最小化しても常に表示される） -->
  <div class="type-switcher">
    <button id="type-bridge" class="type-btn active" onclick="switchFacility('bridge')">🌉 橋梁</button>
    <button id="type-tunnel" class="type-btn" onclick="switchFacility('tunnel')">🚇 トンネル</button>
    <button id="type-deck" class="type-btn" onclick="switchFacility('deck')">🚶 歩道橋</button>
  </div>

  <div id="panel-body" class="panel-body">
    <button class="btn-gps" onclick="searchByGPS()">
      <span id="gps-label">📍 現在地（GPS）から周辺20橋を検索</span>
    </button>

    <div class="style-switcher">
      <button id="btn-3d" class="style-btn active" onclick="switchBaseMap('3d')">🏙️ 3D立体</button>
      <button id="btn-pale" class="style-btn" onclick="switchBaseMap('pale')">🗺️ 地理院淡色</button>
      <button id="btn-photo" class="style-btn" onclick="switchBaseMap('photo')">🛰️ 航空写真</button>
    </div>

    <div id="status" class="status-text"></div>

    <div class="legend">
      <span class="badge b-3">● 判定Ⅲ/Ⅳ(要措置)</span>
      <span class="badge b-2">● 判定Ⅱ(予防保全)</span>
      <span class="badge b-1">● 判定Ⅰ(健全)</span>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
  const WORKER_ENDPOINT = "https://tight-block-116a.morimite2001.workers.dev/";

  // ===== 施設種別の設定 =====
  // term         : 国交DPF検索の検索語（DPF:dataset_title に相当）
  // datasetKeyword: 結果のDPF:dataset_titleにこの語を含むものだけ描画（無ければ素通し）
  // radius       : 検索半径(m)。トンネル・歩道橋は橋梁より数が少ないため広めにしている
  const FACILITIES = {
    bridge: {
      icon: "🌉", name: "橋梁", unit: "橋", title: "全国 橋梁点検マップ", pageTitle: "全国 橋梁点検マップ（DPF連携）",
      term: "橋梁", datasetKeyword: null, radius: 1500, size: 20,
      lenLabel: "橋長", lenKeys: ["kyouchou", "kyoucho"]
    },
    tunnel: {
      icon: "🚇", name: "トンネル", unit: "本", title: "全国 トンネル点検マップ", pageTitle: "全国 トンネル点検マップ（DPF連携）",
      term: "トンネル", datasetKeyword: "トンネル", radius: 5000, size: 20,
      lenLabel: "延長", lenKeys: ["enchou", "encho", "kyouchou", "kyoucho"]
    },
    deck: {
      icon: "🚶", name: "横断歩道橋", unit: "橋", title: "全国 歩道橋点検マップ", pageTitle: "全国 歩道橋点検マップ（DPF連携）",
      term: "横断歩道橋", datasetKeyword: "歩道橋", radius: 3000, size: 20,
      lenLabel: "橋長", lenKeys: ["kyouchou", "kyoucho", "enchou", "encho"]
    }
  };

  let currentType = "bridge";
  let lastSearch = null;   // 直前に検索した地点（種別を切り替えたとき同じ場所で再検索する）
  let requestSeq = 0;      // 古い通信結果が新しい表示を上書きしないためのカウンタ

  function radiusText(r) { return r >= 1000 ? (r / 1000) + "km" : r + "m"; }
  function esc(v) {
    return String(v === undefined || v === null ? "" : v).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [130.557147, 31.596728],
    zoom: 14.5,
    pitch: 55,
    bearing: -15,
    antialias: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

  let bridgeMarkers = [];
  let centerMarker = null;

  function togglePanel() {
    const body = document.getElementById('panel-body');
    const btn = document.getElementById('toggle-btn');
    if (body.classList.contains('collapsed')) {
      body.classList.remove('collapsed');
      btn.textContent = 'ー 最小化';
    } else {
      body.classList.add('collapsed');
      btn.textContent = '＋ 開く';
    }
  }

  map.on('load', () => {
    map.addSource('gsi-pale', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'], tileSize: 256, attribution: '国土地理院' });
    map.addLayer({ id: 'gsi-pale-layer', type: 'raster', source: 'gsi-pale', layout: { visibility: 'none' } });

    map.addSource('gsi-photo', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'], tileSize: 256, attribution: '国土地理院' });
    map.addLayer({ id: 'gsi-photo-layer', type: 'raster', source: 'gsi-photo', layout: { visibility: 'none' } });

    map.addSource('search-circle', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'search-circle-fill', type: 'fill', source: 'search-circle', paint: { 'fill-color': '#38bdf8', 'fill-opacity': 0.12 } });
    map.addLayer({ id: 'search-circle-line', type: 'line', source: 'search-circle', paint: { 'line-color': '#0284c7', 'line-width': 2.5 } });
  });

  function switchBaseMap(mode) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');
    if (map.getLayer('gsi-pale-layer') && map.getLayer('gsi-photo-layer')) {
      map.setLayoutProperty('gsi-pale-layer', 'visibility', mode === 'pale' ? 'visible' : 'none');
      map.setLayoutProperty('gsi-photo-layer', 'visibility', mode === 'photo' ? 'visible' : 'none');
    }
  }

  function createCircleGeoJSON(centerLon, centerLat, radiusInMeters, points = 64) {
    const coords = [];
    const distanceX = radiusInMeters / (111320 * Math.cos(centerLat * Math.PI / 180));
    const distanceY = radiusInMeters / 110574;
    for (let i = 0; i <= points; i++) {
      const theta = (i / points) * (2 * Math.PI);
      coords.push([centerLon + distanceX * Math.cos(theta), centerLat + distanceY * Math.sin(theta)]);
    }
    return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } }] };
  }

  // 判定区分の色・ラベル変換（1〜4、ローマ数字Ⅰ〜Ⅳ対応）
  function getJudgeStyle(judgeVal) {
    const s = String(judgeVal || "").trim();
    if (s === "4" || s.includes("Ⅳ") || s.includes("IV")) {
      return { color: "#7f1d1d", label: "判定Ⅳ (緊急措置段階)" };
    }
    if (s === "3" || s.includes("Ⅲ") || s.includes("III")) {
      return { color: "#ef4444", label: "判定Ⅲ (早期措置段階)" };
    }
    if (s === "2" || s.includes("Ⅱ") || s.includes("II")) {
      return { color: "#f59e0b", label: "判定Ⅱ (予防保全段階)" };
    }
    if (s === "1" || s.includes("Ⅰ") || s.includes("I")) {
      return { color: "#10b981", label: "判定Ⅰ (健全)" };
    }
    return { color: "#64748b", label: s && s !== "記録なし" ? `区分: ${s}` : "記録なし" };
  }

  // JSON文字列があれば自動でオブジェクトに解凍する関数
  function safeParseJSON(val) {
    if (!val) return {};
    if (typeof val === "object") return val;
    if (typeof val === "string") {
      const trimmed = val.trim();
      if ((trimmed.startsWith("{") && trimmed.endsWith("}")) || (trimmed.startsWith("[") && trimmed.endsWith("]"))) {
        try {
          return JSON.parse(trimmed);
        } catch (e) {
          return {};
        }
      }
    }
    return {};
  }

  function applyFacilityUI() {
    const cfg = FACILITIES[currentType];
    document.getElementById('panel-title-text').textContent = `${cfg.icon} ${cfg.title}`;
    document.getElementById('gps-label').textContent = `📍 現在地（GPS）から周辺${cfg.size}${cfg.unit}を検索`;
    document.title = cfg.pageTitle;
    Object.keys(FACILITIES).forEach(k => {
      document.getElementById('type-' + k).classList.toggle('active', k === currentType);
    });
  }

  function setIdleStatus() {
    const cfg = FACILITIES[currentType];
    document.getElementById('status').innerHTML =
      `日本全国対応。現在地ボタンを押すか、地図上の任意の場所をタップしてください（半径${radiusText(cfg.radius)}・周辺${cfg.size}${cfg.unit}）。`;
  }

  function clearMarkers() {
    bridgeMarkers.forEach(m => m.remove());
    bridgeMarkers = [];
  }

  // 橋梁 / トンネル / 歩道橋 をワンタップで切り替え
  function switchFacility(type) {
    if (!FACILITIES[type] || type === currentType) return;
    currentType = type;
    applyFacilityUI();
    try {
      history.replaceState(null, '', location.pathname + location.search + (type === 'bridge' ? '' : '#' + type));
    } catch (e) { /* file:// 等では無視 */ }
    if (lastSearch) {
      fetchFacilities(lastSearch.lat, lastSearch.lon, lastSearch.label);   // 同じ場所で再検索
    } else {
      clearMarkers();
      setIdleStatus();
    }
  }

  // 値が空でない最初のものを返す
  function firstDefined(...vals) {
    for (const v of vals) {
      if (v !== undefined && v !== null && v !== "") return v;
    }
    return undefined;
  }

  // 平坦化マップから、キー末尾が一致する最初の値を探す（項目名の揺れ対策の最終手段）
  function findFlat(flat, regex) {
    for (const [k, v] of Object.entries(flat)) {
      if (regex.test(k)) return v;
    }
    return undefined;
  }

  // RSDB:syogen（諸元）、RSDB:tenken（点検）、RSDB:gyousei_kuiki（行政区域）の入れ子JSONを完全解読する
  function extractFacilityData(meta, cfg) {
    if (!meta || typeof meta !== "object") {
      return { judge: "記録なし", sochi: "記録なし", road: "記録なし", admin: "記録なし", address: "記録なし", year: "記録なし", length: "記録なし", width: "記録なし", inspect: "記録なし", kana: "", flat: {} };
    }

    // 入れ子になったJSON文字列を解凍
    const syogen = safeParseJSON(meta["RSDB:syogen"]);
    const tenken = safeParseJSON(meta["RSDB:tenken"]);
    const gyousei = safeParseJSON(meta["RSDB:gyousei_kuiki"]);

    // 念のため他のキーもすべてJSON解凍して平坦化したマップを作る
    const flat = {};
    const walk = (obj, prefix = "") => {
      if (!obj || typeof obj !== "object") return;
      for (const [k, v] of Object.entries(obj)) {
        const path = prefix ? `${prefix}.${k}` : k;
        if (typeof v === "string" && v.trim().startsWith("{")) {
          walk(safeParseJSON(v), path);
        } else if (v !== null && typeof v === "object") {
          walk(v, path);
        } else if (v !== null && v !== undefined && String(v).trim() !== "") {
          flat[path] = String(v).trim();
        }
      }
    };
    walk(meta);

    // 1. 健全性判定区分（tenken.kiroku.hantei_kubun）
    const judge =
      (tenken.kiroku && tenken.kiroku.hantei_kubun) ||
      tenken.hantei_kubun ||
      meta["RSDB:kiroku_hantei_kubun"] ||
      meta["RSDB:hantei_kubun"] ||
      flat["RSDB:tenken.kiroku.hantei_kubun"] ||
      findFlat(flat, /RSDB:tenken\..*hantei_kubun$/) ||
      "記録なし";

    // 2. 修繕措置状況（tenken.syuzen.sochi_joukyou）
    const sochiCode =
      (tenken.syuzen && tenken.syuzen.sochi_joukyou) ||
      tenken.sochi_joukyou ||
      flat["RSDB:tenken.syuzen.sochi_joukyou"] ||
      findFlat(flat, /RSDB:tenken\..*sochi_joukyou$/) ||
      "";
    const sochiMap = {
      "1": "1 (未着手)",
      "2": "2 (調査・設計中)",
      "3": "3 (工事着手済)",
      "4": "4 (措置完了)",
      "8": "8 (措置不要・経過観察等)",
      "9": "9 (その他)"
    };
    const sochi = sochiCode ? (sochiMap[String(sochiCode)] || `コード: ${sochiCode}`) : "記録なし";

    // 3. 点検年度（tenken.nendo）
    let rawInspect =
      tenken.nendo ||
      (tenken.kiroku && tenken.kiroku.nendo) ||
      meta["DPF:year"] ||
      "記録なし";
    const inspect = /^\d{4}$/.test(String(rawInspect)) ? `${rawInspect}年度` : String(rawInspect);

    // 4. 橋長/延長（syogen.kyouchou / enchou）と 幅員（syogen.fukuin）
    const lenFromSyogen = firstDefined(...cfg.lenKeys.map(k => syogen[k]));
    const rawLen = firstDefined(
      lenFromSyogen,
      meta["RSDB:kyoucho"],
      flat["RSDB:syogen.kyouchou"],
      findFlat(flat, /RSDB:syogen\.(kyouchou|kyoucho|enchou|encho)$/)
    );
    const length = rawLen !== undefined ? `${rawLen} m` : "記録なし";

    const rawWid = firstDefined(
      syogen.fukuin,
      meta["RSDB:fukuin"],
      flat["RSDB:syogen.fukuin"],
      findFlat(flat, /RSDB:syogen\.fukuin$/)
    );
    const width = rawWid !== undefined ? `${rawWid} m` : "記録なし";

    // 5. 路線名（syogen.rosen.meisyou または DPF:route_name）
    const road =
      (syogen.rosen && syogen.rosen.meisyou) ||
      meta["DPF:route_name"] ||
      flat["RSDB:syogen.rosen.meisyou"] ||
      "記録なし";

    // 6. 管理者（syogen.kanrisya.meisyou + jimusyo）
    let admin = "記録なし";
    if (syogen.kanrisya) {
      const m = syogen.kanrisya.meisyou || "";
      const j = syogen.kanrisya.jimusyo || "";
      admin = [m, j].filter(Boolean).join(" ") || "記録なし";
    }
    if (admin === "記録なし") {
      admin = meta["DPF:organization_name"] || (meta["RSDB:kanrisya_code"] ? `コード: ${meta["RSDB:kanrisya_code"]}` : "記録なし");
    }

    // 7. 所在地（gyousei_kuiki.todoufuken_mei + shikuchouson_mei）
    let address = "記録なし";
    if (gyousei.todoufuken_mei || gyousei.shikuchouson_mei) {
      address = `${gyousei.todoufuken_mei || ""}${gyousei.shikuchouson_mei || ""}`;
    } else if (meta["DPF:address"]) {
      address = String(meta["DPF:address"]);
    }

    // 8. 架設年（syogen.kasetsu_nendo または DPF:erection_datetime。トンネルは供用開始年などの揺れも拾う）
    let rawYear =
      syogen.kasetsu_nendo ||
      syogen.kasetsu_nen ||
      meta["DPF:erection_datetime"] ||
      findFlat(flat, /RSDB:syogen\.(kasetsu|kyouyou|kansei)[a-z_]*(nendo|nen)$/) ||
      "記録なし";
    let year = String(rawYear);
    if (/^\d{4}/.test(year)) {
      const y = parseInt(year.substring(0, 4), 10);
      if (y > 1850 && y <= new Date().getFullYear()) {
        year = `${y}年 (築${new Date().getFullYear() - y}年)`;
      }
    }

    // 9. フリガナ
    const kana =
      (syogen.shisetsu && syogen.shisetsu.furigana) ||
      meta["DPF:title_furigana"] ||
      "";

    return { judge: String(judge), sochi, road, admin, address, year, length, width, inspect, kana, flat };
  }

  function searchByGPS() {
    const status = document.getElementById('status');
    if (!navigator.geolocation) {
      status.innerHTML = "❌ お使いの端末は位置情報に対応していません。";
      return;
    }
    status.innerHTML = "📡 GPS・Wi-Fiから現在地を取得しています...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo({ center: [lon, lat], zoom: 15, pitch: 55, essential: true });
        fetchFacilities(lat, lon, "現在地（GPS）");
      },
      () => {
        status.innerHTML = "❌ 現在地の取得に失敗しました。位置情報許可を確認するか、地図上を直接タップしてください。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  map.on('click', (e) => {
    if (e.originalEvent.target.closest('.bridge-marker') || e.originalEvent.target.closest('.maplibregl-popup')) {
      return;
    }
    fetchFacilities(e.lngLat.lat, e.lngLat.lng, "指定地点");
  });

  async function fetchFacilities(lat, lon, label) {
    const cfg = FACILITIES[currentType];
    const seq = ++requestSeq;
    lastSearch = { lat, lon, label };
    const status = document.getElementById('status');

    clearMarkers();
    if (centerMarker) centerMarker.remove();

    if (map.getSource('search-circle')) {
      map.getSource('search-circle').setData(createCircleGeoJSON(lon, lat, cfg.radius));
    }

    centerMarker = new maplibregl.Marker({ color: "#0284c7" })
      .setLngLat([lon, lat])
      .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b>📍 ${esc(label)}</b><br>緯度: ${lat.toFixed(5)}<br>経度: ${lon.toFixed(5)}`))
      .addTo(map);

    status.innerHTML = `🔄 ${esc(label)}から半径${radiusText(cfg.radius)}以内の${cfg.name}データを取得中...`;

    const query = `
      query {
        search(
          term: "${cfg.term}"
          locationFilter: {
            geoDistance: {
              lat: ${lat}
              lon: ${lon}
              distance: ${Number(cfg.radius).toFixed(1)}
            }
          }
          first: 0
          size: ${cfg.size}
        ) {
          totalNumber
          searchResults {
            id
            title
            lat
            lon
            metadata
          }
        }
      }
    `;

    try {
      const response = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      if (!response.ok) throw new Error(`HTTP status ${response.status}`);

      const json = await response.json();
      if (seq !== requestSeq) return;   // 切替・再検索で古くなった結果は捨てる

      if (json.errors) {
        status.innerHTML = "❌ クエリエラー: " + esc(json.errors[0].message);
        return;
      }

      const searchData = (json.data && json.data.search) || {};
      const rawRecords = searchData.searchResults || [];
      const total = searchData.totalNumber || 0;

      // 検索語が他のデータセットにも当たる場合に備え、種別が明らかに違うものだけ除外する
      const records = cfg.datasetKeyword
        ? rawRecords.filter(r => {
            const t = r.metadata && r.metadata["DPF:dataset_title"];
            return !t || String(t).includes(cfg.datasetKeyword);
          })
        : rawRecords;

      if (records.length === 0) {
        status.innerHTML = `ℹ️ 周辺${radiusText(cfg.radius)}以内に${cfg.name}データは見つかりませんでした。地図上の別の場所をタップしてみてください。`;
        return;
      }

      status.innerHTML = `✅ 検索ヒット総数: <b>${total}件</b>（周辺 <b>${records.length}${cfg.unit}</b> を描画）<br>色付きの丸い点をタップすると点検結果を表示します。`;

      if (window.innerWidth <= 600) {
        document.getElementById('panel-body').classList.add('collapsed');
        document.getElementById('toggle-btn').textContent = '＋ 開く';
      }

      records.forEach((item) => {
        if (!item.lat || !item.lon) return;
        const meta = item.metadata || {};
        const info = extractFacilityData(meta, cfg);
        const style = getJudgeStyle(info.judge);

        // 判定区分（Ⅰ:緑、Ⅱ:オレンジ、Ⅲ:赤、Ⅳ:濃赤）でマーカーを着色
        const el = document.createElement('div');
        el.className = 'bridge-marker';
        el.style.width = '22px';
        el.style.height = '22px';
        el.style.borderRadius = '50%';
        el.style.backgroundColor = style.color;
        el.style.border = '3px solid #ffffff';
        el.style.boxShadow = '0 3px 8px rgba(0,0,0,0.5)';
        el.style.cursor = 'pointer';

        // 解凍された全データの詳細テーブル
        let detailRows = "";
        for (const [k, v] of Object.entries(info.flat || {})) {
          if (k === "DPF:downloadURLs") continue;
          detailRows += `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
        }

        const kanaHtml = info.kana ? `<span style="font-size:11px; color:#64748b; font-weight:normal; margin-left:6px;">${esc(info.kana)}</span>` : "";

        const popupHtml = `
          <div>
            <div class="popup-title" style="border-color:${style.color};">
              ${esc(item.title || "名称未詳")}${kanaHtml}
            </div>
            <table class="popup-table">
              <tr><th>健全性判定(全体)</th><td><b style="color:${style.color}; font-size:13px;">${esc(style.label)}</b></td></tr>
              <tr><th>修繕措置状況</th><td>${esc(info.sochi)}</td></tr>
              <tr><th>路線名</th><td>${esc(info.road)}</td></tr>
              <tr><th>管理者</th><td>${esc(info.admin)}</td></tr>
              <tr><th>所在地</th><td>${esc(info.address)}</td></tr>
              <tr><th>架設年</th><td>${esc(info.year)}</td></tr>
              <tr><th>${cfg.lenLabel} / 幅員</th><td><b>${esc(info.length)}</b> / <b>${esc(info.width)}</b></td></tr>
              <tr><th>最新点検年度</th><td>${esc(info.inspect)}</td></tr>
              <tr><th>位置座標</th><td>${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</td></tr>
            </table>
            <details style="margin-top:8px; font-size:11px;">
              <summary style="cursor:pointer; color:#0284c7; font-weight:bold;">📋 解読済み全データ項目を見る</summary>
              <div style="max-height:160px; overflow-y:auto; margin-top:5px;">
                <table class="popup-table">${detailRows}</table>
              </div>
            </details>
          </div>
        `;

        const popup = new maplibregl.Popup({ offset: 15, closeButton: true }).setHTML(popupHtml);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([Number(item.lon), Number(item.lat)])
          .setPopup(popup)
          .addTo(map);

        bridgeMarkers.push(marker);
      });

    } catch (err) {
      if (seq !== requestSeq) return;
      status.innerHTML = "❌ 通信エラーが発生しました: " + esc(err.message);
      console.error(err);
    }
  }

  // 起動時: URLハッシュ(#tunnel / #deck)で種別を指定できる
  (function initFacility() {
    const h = (location.hash || "").replace("#", "");
    if (FACILITIES[h]) currentType = h;
    applyFacilityUI();
    setIdleStatus();
  })();
</script>
</body>
</html>
