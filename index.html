<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全国 橋梁点検マップ（DPF連携）</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif; background: #0f172a; }
    #map { width: 100%; height: 100%; cursor: crosshair; }

    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 335px;
      max-width: calc(100vw - 24px);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 14px;
      border-radius: 14px;
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .panel-body { margin-top: 10px; }
    .panel-body.collapsed { display: none; }

    .btn-gps {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .style-switcher { display: flex; gap: 6px; margin-bottom: 10px; }
    .style-btn {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .style-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .status-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.45;
      margin-bottom: 10px;
      background: rgba(30, 41, 59, 0.75);
      padding: 8px 10px;
      border-radius: 6px;
    }
    .legend {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      font-size: 11px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .badge { padding: 3px 7px; border-radius: 4px; font-weight: bold; color: #fff; }
    .b-3 { background: #ef4444; }
    .b-2 { background: #f59e0b; }
    .b-1 { background: #10b981; }

    .maplibregl-popup { max-width: 340px !important; z-index: 30; }
    .maplibregl-popup-content {
      padding: 14px !important;
      border-radius: 12px !important;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      box-sizing: border-box;
      width: 310px;
      max-width: calc(100vw - 32px);
      max-height: 75vh;
      overflow-y: auto;
    }
    .maplibregl-popup-close-button { font-size: 20px; padding: 4px 8px; color: #475569; }
    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin: 0 0 8px 0;
      padding-bottom: 5px;
      padding-right: 18px;
      border-bottom: 3px solid #ef4444;
      color: #0f172a;
      word-break: break-all;
    }
    .popup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: fixed;
    }
    .popup-table th, .popup-table td {
      border: 1px solid #cbd5e1;
      padding: 5px 6px;
      text-align: left;
      word-break: break-all;
      overflow-wrap: break-word;
      vertical-align: top;
    }
    .popup-table th { background: #f1f5f9; width: 40%; color: #334155; font-weight: 600; }
    .popup-table td { width: 60%; color: #0f172a; }
    .xroad-btn {
      display: block;
      margin-top: 8px;
      padding: 7px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      text-align: center;
      font-size: 11.5px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="control-panel">
  <div class="panel-header" onclick="togglePanel()">
    <div class="panel-title"><span>🌉 全国 橋梁点検マップ</span></div>
    <button id="toggle-btn" class="toggle-btn">ー 最小化</button>
  </div>

  <div id="panel-body" class="panel-body">
    <button class="btn-gps" onclick="searchByGPS()">
      📍 現在地（GPS）から周辺20橋を検索
    </button>

    <div class="style-switcher">
      <button id="btn-3d" class="style-btn active" onclick="switchBaseMap('3d')">🏙️ 3D立体</button>
      <button id="btn-pale" class="style-btn" onclick="switchBaseMap('pale')">🗺️ 地理院淡色</button>
      <button id="btn-photo" class="style-btn" onclick="switchBaseMap('photo')">🛰️ 航空写真</button>
    </div>

    <div id="status" class="status-text">
      日本全国対応。現在地ボタンを押すか、地図上の任意の場所をタップしてください（半径1.5km・周辺20橋）。
    </div>

    <div class="legend">
      <span class="badge b-3">● 判定Ⅲ/Ⅳ(要措置)</span>
      <span class="badge b-2">● 判定Ⅱ(予防保全)</span>
      <span class="badge b-1">● 判定Ⅰ(健全)</span>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
  const WORKER_ENDPOINT = "https://tight-block-116a.morimite2001.workers.dev/";
  const SEARCH_RADIUS = 1500.0;

  // 国交省DPFカタログAPIから自動取得する日本語属性辞書
  let catalogAttrDict = {
    "DPF:title": "名称",
    "DPF:title_furigana": "名称フリガナ",
    "DPF:route_name": "路線名",
    "DPF:organization_name": "管理組織",
    "DPF:Updated_organization_name": "更新組織",
    "DPF:address": "所在地",
    "DPF:erection_datetime": "架設年月日",
    "DPF:year": "データ年度",
    "DPF:latitude": "緯度",
    "DPF:longitude": "経度",
    "DPF:object_category": "施設分類",
    "DPF:catalog_title": "カタログ名",
    "DPF:dataset_name": "データセット名"
  };
  let isCatalogLoaded = false;

  // 初回に国交省DPFの「カタログ情報取得API (rsdb)」を呼び出し、RSDB属性の正式な日本語表示名を全件取得する
  async function loadRsdbCatalogDictionary() {
    if (isCatalogLoaded) return;
    const query = `
      query {
        dataCatalog(IDs: ["rsdb"]) {
          id
          datasets {
            id
            datatype_desc {
              attributes {
                name
                display_name
              }
            }
          }
        }
      }
    `;
    try {
      const res = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      if (!res.ok) return;
      const json = await res.json();
      const catalogs = (json.data && json.data.dataCatalog) || [];
      catalogs.forEach(cat => {
        (cat.datasets || []).forEach(ds => {
          const attrs = (ds.datatype_desc && ds.datatype_desc.attributes) || [];
          attrs.forEach(a => {
            if (a.name && a.display_name) {
              catalogAttrDict[a.name] = a.display_name;
            }
          });
        });
      });
      isCatalogLoaded = true;
    } catch (e) {
      console.warn("カタログ辞書の取得をスキップしました:", e);
    }
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [130.557147, 31.596728],
    zoom: 14.5,
    pitch: 55,
    bearing: -15,
    antialias: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

  let bridgeMarkers = [];
  let centerMarker = null;

  function togglePanel() {
    const body = document.getElementById('panel-body');
    const btn = document.getElementById('toggle-btn');
    if (body.classList.contains('collapsed')) {
      body.classList.remove('collapsed');
      btn.textContent = 'ー 最小化';
    } else {
      body.classList.add('collapsed');
      btn.textContent = '＋ 開く';
    }
  }

  map.on('load', () => {
    loadRsdbCatalogDictionary();

    map.addSource('gsi-pale', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'], tileSize: 256, attribution: '国土地理院' });
    map.addLayer({ id: 'gsi-pale-layer', type: 'raster', source: 'gsi-pale', layout: { visibility: 'none' } });

    map.addSource('gsi-photo', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'], tileSize: 256, attribution: '国土地理院' });
    map.addLayer({ id: 'gsi-photo-layer', type: 'raster', source: 'gsi-photo', layout: { visibility: 'none' } });

    map.addSource('search-circle', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'search-circle-fill', type: 'fill', source: 'search-circle', paint: { 'fill-color': '#38bdf8', 'fill-opacity': 0.12 } });
    map.addLayer({ id: 'search-circle-line', type: 'line', source: 'search-circle', paint: { 'line-color': '#0284c7', 'line-width': 2.5 } });
  });

  function switchBaseMap(mode) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');
    if (map.getLayer('gsi-pale-layer') && map.getLayer('gsi-photo-layer')) {
      map.setLayoutProperty('gsi-pale-layer', 'visibility', mode === 'pale' ? 'visible' : 'none');
      map.setLayoutProperty('gsi-photo-layer', 'visibility', mode === 'photo' ? 'visible' : 'none');
    }
  }

  function createCircleGeoJSON(centerLon, centerLat, radiusInMeters, points = 64) {
    const coords = [];
    const distanceX = radiusInMeters / (111320 * Math.cos(centerLat * Math.PI / 180));
    const distanceY = radiusInMeters / 110574;
    for (let i = 0; i <= points; i++) {
      const theta = (i / points) * (2 * Math.PI);
      coords.push([centerLon + distanceX * Math.cos(theta), centerLat + distanceY * Math.sin(theta)]);
    }
    return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } }] };
  }

  // 判定区分の色・表示名変換（1〜4、ローマ数字Ⅰ〜Ⅳの両対応）
  function getJudgeStyle(judgeVal) {
    const s = String(judgeVal || "").trim();
    if (s === "4" || s.includes("Ⅳ") || s.includes("IV") || s.includes("緊急")) {
      return { color: "#7f1d1d", label: "判定Ⅳ (緊急措置段階)" };
    }
    if (s === "3" || s.includes("Ⅲ") || s.includes("III") || s.includes("早期")) {
      return { color: "#ef4444", label: "判定Ⅲ (早期措置段階)" };
    }
    if (s === "2" || s.includes("Ⅱ") || s.includes("II") || s.includes("予防")) {
      return { color: "#f59e0b", label: "判定Ⅱ (予防保全段階)" };
    }
    if (s === "1" || s.includes("Ⅰ") || s.includes("I") || s.includes("健全")) {
      return { color: "#10b981", label: "判定Ⅰ (健全)" };
    }
    return { color: "#ef4444", label: s && s !== "記録なし" ? `判定: ${s}` : "記録確認中" };
  }

  // カタログの日本語表示名（display_name）と英語キーの両方を使って確実に値を抽出する
  function extractBridgeSummary(meta) {
    if (!meta || typeof meta !== 'object') {
      return { judge: "記録なし", road: "記録なし", admin: "記録なし", address: "記録なし", year: "記録なし", length: "記録なし", width: "記録なし", inspect: "記録なし", xroadUrl: "" };
    }

    // まずすべてのメタデータを「日本語名付きリスト」に変換
    const entries = [];
    for (const [k, v] of Object.entries(meta)) {
      if (v === null || v === undefined || v === "") continue;
      const valStr = Array.isArray(v) ? v.join(", ") : (typeof v === "object" ? JSON.stringify(v) : String(v));
      if (!valStr.trim()) continue;
      const jpName = catalogAttrDict[k] || "";
      entries.push({ key: k, jp: jpName, val: valStr.trim() });
    }

    // 日本語表示名またはキー名から検索するヘルパー
    const findBy = (jpKeywords, keyKeywords, excludeKeys = []) => {
      // 1. カタログ日本語名（display_name）で探す（最も確実）
      for (const kw of jpKeywords) {
        for (const item of entries) {
          if (excludeKeys.includes(item.key)) continue;
          if (item.jp && item.jp.includes(kw)) return item.val;
        }
      }
      // 2. キー名（英語/ローマ字）で探す
      for (const kw of keyKeywords) {
        for (const item of entries) {
          if (excludeKeys.includes(item.key)) continue;
          if (item.key.toLowerCase().includes(kw.toLowerCase())) return item.val;
        }
      }
      return "記録なし";
    };

    // ① 健全性判定区分（施設区分 shisetsu_kubun は除外して検索）
    const judge = findBy(
      ["判定区分", "健全性", "健全度", "判定"],
      ["kiroku_hantei", "hantei_kubun", "zenkoku_hantei", "hantei", "judge"],
      ["RSDB:shisetsu_kubun", "DPF:object_category"]
    );

    // ② 路線名
    const road = findBy(["路線名", "路線"], ["route_name", "rosen"]);

    // ③ 管理者名（なければ管理コードを表示）
    let admin = findBy(["管理者名", "管理組織", "道路管理者", "管理者"], ["kanrisha_mei", "kanrisya_mei", "organization_name", "admin_name"]);
    if (admin === "記録なし") {
      const code = findBy(["管理者コード"], ["kanrisha_code", "kanrisya_code"]);
      if (code !== "記録なし") admin = `管理者コード: ${code}`;
    }

    // ④ 所在地
    const address = findBy(["所在地", "住所", "位置"], ["address", "shozaichi", "syozaichi"]);

    // ⑤ 架設年（DPF:year などの登録年度は除外）
    let rawYear = findBy(
      ["架設年", "架設年月日", "竣工", "完成"],
      ["erection_datetime", "kasetsu", "built_year"],
      ["DPF:year", "DPF:year_origin", "RSDB:koushin_nichiji", "DPF:last_updated_datetime"]
    );
    let yearStr = rawYear;
    if (/^\d{4}-\d{2}-\d{2}/.test(rawYear) || /^\d{4}$/.test(rawYear)) {
      const y = parseInt(rawYear.substring(0, 4), 10);
      if (y > 1850 && y <= new Date().getFullYear()) {
        yearStr = `${y}年 (築${new Date().getFullYear() - y}年)`;
      }
    }

    // ⑥ 橋長・幅員
    let length = findBy(["橋長", "施設延長", "延長"], ["kyoucho", "kyoutyou", "enchou", "bridge_length", "length"]);
    if (length !== "記録なし" && !length.includes("m")) length += " m";

    let width = findBy(["幅員", "全幅員"], ["fukuin", "hukuin", "width"]);
    if (width !== "記録なし" && !width.includes("m")) width += " m";

    // ⑦ 点検年度
    let inspect = findBy(["点検年度", "点検記録年度", "調査年度", "データ年度"], ["tenken_nendo", "kiroku_nendo", "DPF:year"], ["DPF:year_origin"]);
    if (/^\d{4}$/.test(inspect)) inspect += "年度";

    // ⑧ xROADダウンロードURL
    let xroadUrl = "";
    if (meta["DPF:downloadURLs"]) {
      xroadUrl = Array.isArray(meta["DPF:downloadURLs"]) ? meta["DPF:downloadURLs"][0] : String(meta["DPF:downloadURLs"]);
    }

    return { judge, road, admin, address, year: yearStr, length, width, inspect, xroadUrl, entries };
  }

  function searchByGPS() {
    const status = document.getElementById('status');
    if (!navigator.geolocation) {
      status.innerHTML = "❌ お使いの端末は位置情報に対応していません。";
      return;
    }
    status.innerHTML = "📡 GPS・Wi-Fiから現在地を取得しています...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo({ center: [lon, lat], zoom: 15, pitch: 55, essential: true });
        fetchBridges(lat, lon, "現在地（GPS）");
      },
      () => {
        status.innerHTML = "❌ 現在地の取得に失敗しました。位置情報許可を確認するか、地図上を直接タップしてください。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  map.on('click', (e) => {
    if (e.originalEvent.target.closest('.bridge-marker') || e.originalEvent.target.closest('.maplibregl-popup')) {
      return;
    }
    fetchBridges(e.lngLat.lat, e.lngLat.lng, "指定地点");
  });

  async function fetchBridges(lat, lon, label) {
    const status = document.getElementById('status');

    // カタログ辞書が未ロードなら先にロード
    await loadRsdbCatalogDictionary();

    bridgeMarkers.forEach(m => m.remove());
    bridgeMarkers = [];
    if (centerMarker) centerMarker.remove();

    if (map.getSource('search-circle')) {
      map.getSource('search-circle').setData(createCircleGeoJSON(lon, lat, SEARCH_RADIUS));
    }

    centerMarker = new maplibregl.Marker({ color: "#0284c7" })
      .setLngLat([lon, lat])
      .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b>📍 ${label}</b><br>緯度: ${lat.toFixed(5)}<br>経度: ${lon.toFixed(5)}`))
      .addTo(map);

    status.innerHTML = `🔄 ${label}から半径1.5km以内の橋梁データを取得中...`;

    const query = `
      query {
        search(
          term: "橋梁"
          locationFilter: {
            geoDistance: {
              lat: ${lat}
              lon: ${lon}
              distance: ${SEARCH_RADIUS}
            }
          }
          first: 0
          size: 20
        ) {
          totalNumber
          searchResults {
            id
            title
            lat
            lon
            metadata
          }
        }
      }
    `;

    try {
      const response = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      if (!response.ok) throw new Error(`HTTP status ${response.status}`);

      const json = await response.json();
      if (json.errors) {
        status.innerHTML = "❌ クエリエラー: " + json.errors[0].message;
        return;
      }

      const searchData = (json.data && json.data.search) || {};
      const records = searchData.searchResults || [];
      const total = searchData.totalNumber || 0;

      if (records.length === 0) {
        status.innerHTML = `ℹ️ 周辺1.5km以内に橋梁データは見つかりませんでした。`;
        return;
      }

      status.innerHTML = `✅ 検索ヒット総数: <b>${total}件</b>（周辺 <b>${records.length}橋</b> を描画）<br>丸い点をタップすると点検結果を表示します。`;

      if (window.innerWidth <= 600) {
        document.getElementById('panel-body').classList.add('collapsed');
        document.getElementById('toggle-btn').textContent = '＋ 開く';
      }

      records.forEach((item) => {
        if (!item.lat || !item.lon) return;
        const meta = item.metadata || {};
        const info = extractBridgeSummary(meta);
        const style = getJudgeStyle(info.judge);

        const el = document.createElement('div');
        el.className = 'bridge-marker';
        el.style.width = '22px';
        el.style.height = '22px';
        el.style.borderRadius = '50%';
        el.style.backgroundColor = style.color;
        el.style.border = '3px solid #ffffff';
        el.style.boxShadow = '0 3px 8px rgba(0,0,0,0.5)';
        el.style.cursor = 'pointer';

        // RSDBの項目を優先して全登録項目テーブルを構築（正式な日本語名を自動表示）
        const sortedEntries = [...info.entries].sort((a, b) => {
          const aIsRsdb = a.key.startsWith("RSDB:") ? 0 : 1;
          const bIsRsdb = b.key.startsWith("RSDB:") ? 0 : 1;
          return aIsRsdb - bIsRsdb;
        });

        let allMetaRows = "";
        sortedEntries.forEach(({ key, jp, val }) => {
          const labelHtml = jp ? `<b>${jp}</b><br><span style="font-size:9px;color:#64748b;">${key}</span>` : key;
          let dispVal = val;
          if (/^\d{4}-\d{2}-\d{2}T/.test(dispVal)) dispVal = dispVal.substring(0, 10);
          allMetaRows += `<tr><th>${labelHtml}</th><td>${dispVal}</td></tr>`;
        });

        const xroadBtnHtml = info.xroadUrl
          ? `<a class="xroad-btn" href="${info.xroadUrl}" target="_blank" rel="noopener">🔗 xROAD (全国道路施設点検DB) APIデータを開く</a>`
          : "";

        const popupHtml = `
          <div>
            <div class="popup-title" style="border-color:${style.color};">
              ${item.title || "名称未詳"}
            </div>
            <table class="popup-table">
              <tr><th>健全性判定(全体)</th><td><b style="color:${style.color};">${style.label}</b></td></tr>
              <tr><th>路線名</th><td>${info.road}</td></tr>
              <tr><th>管理者</th><td>${info.admin}</td></tr>
              <tr><th>所在地</th><td>${info.address}</td></tr>
              <tr><th>架設年</th><td>${info.year}</td></tr>
              <tr><th>橋長 / 幅員</th><td>${info.length} / ${info.width}</td></tr>
              <tr><th>点検・データ年</th><td>${info.inspect}</td></tr>
              <tr><th>位置座標</th><td>${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</td></tr>
            </table>
            ${xroadBtnHtml}
            <details style="margin-top:8px; font-size:11px;">
              <summary style="cursor:pointer; color:#0284c7; font-weight:bold;">📋 国交省DPFの全登録項目を見る（RSDB優先）</summary>
              <div style="max-height:170px; overflow-y:auto; margin-top:5px;">
                <table class="popup-table">${allMetaRows}</table>
              </div>
            </details>
          </div>
        `;

        const popup = new maplibregl.Popup({ offset: 15, closeButton: true }).setHTML(popupHtml);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([Number(item.lon), Number(item.lat)])
          .setPopup(popup)
          .addTo(map);

        bridgeMarkers.push(marker);
      });

    } catch (err) {
      status.innerHTML = "❌ 通信エラーが発生しました: " + err.message;
      console.error(err);
    }
  }
</script>
</body>
</html>
