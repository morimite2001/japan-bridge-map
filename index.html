<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鹿児島 橋梁点検マップ (DPF連携)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif; }
    #map { width: 100%; height: 100%; }
    
    /* 操作パネル（スマホでも邪魔にならないフローティング設計） */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 14px;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      margin: 0 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-gps {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-gps:active { background: #0369a1; }
    .status-text {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .legend {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
      color: #fff;
    }
    .b-1 { background: #10b981; } /* 判定Ⅰ */
    .b-2 { background: #f59e0b; } /* 判定Ⅱ */
    .b-3 { background: #ef4444; } /* 判定Ⅲ */
    .b-4 { background: #7f1d1d; } /* 判定Ⅳ */
    .b-u { background: #64748b; } /* 不明 */

    /* APIキー設定エリア */
    .key-box {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      font-size: 11px;
    }
    .key-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      margin-top: 4px;
    }

    /* ポップアップ内テーブル */
    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin: 0 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #ef4444;
      color: #0f172a;
    }
    .popup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .popup-table th, .popup-table td {
      border: 1px solid #cbd5e1;
      padding: 5px 6px;
      text-align: left;
    }
    .popup-table th {
      background: #f1f5f9;
      width: 38%;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="control-panel">
  <div class="panel-title">
    <span>🌉 鹿児島 橋梁点検マップ</span>
    <button onclick="toggleKeyBox()" style="background:none;border:1px solid #475569;color:#94a3b8;border-radius:4px;font-size:11px;padding:2px 6px;cursor:pointer;">APIキー設定</button>
  </div>

  <button class="btn-gps" onclick="searchByGPS()">
    📍 現在地（GPS）から周辺20橋を検索
  </button>

  <div id="status" class="status-text">
    現在地ボタンを押すか、地図上の調べたい場所をタップしてください（半径1.5km・最大20橋）。
  </div>

  <div class="legend">
    <span class="badge b-3">● 判定Ⅲ/Ⅳ(要措置)</span>
    <span class="badge b-2">● 判定Ⅱ(予防保全)</span>
    <span class="badge b-1">● 判定Ⅰ(健全)</span>
    <span class="badge b-u">● 記録確認中</span>
  </div>

  <div id="key-box" class="key-box" style="display:none;">
    <div>国土交通DPF APIキー（ブラウザに保存されます）：</div>
    <input type="password" id="dpf-key-input" class="key-input" placeholder="DPF APIキーを入力" onchange="saveApiKey()" />
  </div>
</div>

<div id="map"></div>

<script>
  const DPF_ENDPOINT = "https://data-platform.mlit.go.jp/api/v1/";
  const SEARCH_RADIUS = 1500.0; // 1.5km

  // 初期表示：鹿児島市役所周辺（ズームコントロールは右下へ配置）
  const map = L.map('map', { zoomControl: false }).setView([31.596728, 130.557147], 14);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 地図タイル（地理院淡色地図 ＆ OpenStreetMap ＆ 航空写真）
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { attribution: '国土地理院' });
  const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: '国土地理院' });
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
  gsiPale.addTo(map);
  L.control.layers({
    "国土地理院(淡色)": gsiPale,
    "航空写真": gsiPhoto,
    "OpenStreetMap": osm
  }, null, { position: 'bottomright' }).addTo(map);

  let markersLayer = L.layerGroup().addTo(map);
  let searchCircle = null;

  // 保存済みAPIキーの読み込み
  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('mlit_dpf_api_key') || '';
    document.getElementById('dpf-key-input').value = savedKey;
    if (!savedKey) {
      document.getElementById('key-box').style.display = 'block';
    }
  });

  function toggleKeyBox() {
    const box = document.getElementById('key-box');
    box.style.display = (box.style.display === 'none') ? 'block' : 'none';
  }

  function saveApiKey() {
    const val = document.getElementById('dpf-key-input').value.trim();
    localStorage.setItem('mlit_dpf_api_key', val);
    document.getElementById('status').innerHTML = "✅ APIキーをブラウザに保存しました。地図をタップして検索できます。";
  }

  // 判定区分に応じたマーカー色を返す
  function getJudgeStyle(judgeStr) {
    const s = String(judgeStr || "");
    if (s.includes("4") || s.includes("Ⅳ") || s.includes("IV")) return { color: "#7f1d1d", label: "判定Ⅳ (緊急措置)" };
    if (s.includes("3") || s.includes("Ⅲ") || s.includes("III")) return { color: "#ef4444", label: "判定Ⅲ (早期措置)" };
    if (s.includes("2") || s.includes("Ⅱ") || s.includes("II")) return { color: "#f59e0b", label: "判定Ⅱ (予防保全)" };
    if (s.includes("1") || s.includes("Ⅰ") || s.includes("I")) return { color: "#10b981", label: "判定Ⅰ (健全)" };
    return { color: "#ef4444", label: s || "記録確認中" }; // デフォルトは視認性の高い赤丸
  }

  // メタデータから目的の属性を柔軟に抽出
  function pickMeta(meta, keys) {
    if (!meta || typeof meta !== 'object') return "記録なし";
    for (const [k, v] of Object.entries(meta)) {
      if (v === null || v === "") continue;
      for (const kw of keys) {
        if (k.toLowerCase().includes(kw.toLowerCase())) return String(v);
      }
    }
    return "記録なし";
  }

  // GPS現在地から検索
  function searchByGPS() {
    const status = document.getElementById('status');
    if (!navigator.geolocation) {
      status.innerHTML = "❌ お使いのブラウザは位置情報に対応していません。";
      return;
    }
    status.innerHTML = "📡 GPSで現在地を取得しています...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 15);
        fetchBridges(lat, lon, "現在地（GPS）");
      },
      (err) => {
        status.innerHTML = "❌ 位置情報の取得に失敗しました。スマホの位置情報許可を確認してください。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // 地図タップ・クリックで検索
  map.on('click', (e) => {
    fetchBridges(e.latlng.lat, e.latlng.lng, "指定地点");
  });

  // DPF APIへリクエスト（直接通信がCORSブロックされた場合は自動でプロキシ経由にフォールバック）
  async function postToDPF(apiKey, query) {
    const payload = JSON.stringify({ query });
    const headers = { "Content-Type": "application/json", "apikey": apiKey };

    try {
      const res = await fetch(DPF_ENDPOINT, { method: "POST", headers, body: payload });
      if (res.ok) return await res.json();
    } catch (e) {
      // ブラウザ直接通信がCORS制限された場合の中継フォールバック
      const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(DPF_ENDPOINT);
      const res2 = await fetch(proxyUrl, { method: "POST", headers, body: payload });
      if (res2.ok) return await res2.json();
      throw e;
    }
    throw new Error("API通信エラー");
  }

  async function fetchBridges(lat, lon, label) {
    const apiKey = document.getElementById('dpf-key-input').value.trim();
    const status = document.getElementById('status');

    if (!apiKey) {
      document.getElementById('key-box').style.display = 'block';
      status.innerHTML = "⚠️ 先に「APIキー設定」から国土交通DPFのAPIキーを入力してください。";
      return;
    }

    markersLayer.clearLayers();
    if (searchCircle) map.removeLayer(searchCircle);

    // 検索範囲の円と中心ピンを描画
    searchCircle = L.circle([lat, lon], {
      radius: SEARCH_RADIUS,
      color: '#38bdf8',
      weight: 2,
      fillOpacity: 0.08
    }).addTo(map);

    L.marker([lat, lon]).addTo(markersLayer)
      .bindPopup(`<b>📍 ${label}</b><br>緯度: ${lat.toFixed(5)}<br>経度: ${lon.toFixed(5)}`)
      .openPopup();

    status.innerHTML = `🔄 ${label}から半径1.5km以内の橋梁を検索中...`;

    const query = `
      query {
        search(
          term: "橋梁"
          locationFilter: {
            geoDistance: {
              lat: ${lat}
              lon: ${lon}
              distance: ${SEARCH_RADIUS}
            }
          }
          first: 0
          size: 20
        ) {
          totalNumber
          searchResults {
            id
            title
            lat
            lon
            metadata
          }
        }
      }
    `;

    try {
      const json = await postToDPF(apiKey, query);
      if (json.errors) {
        status.innerHTML = "❌ クエリエラー: " + json.errors[0].message;
        return;
      }

      const searchData = (json.data && json.data.search) || {};
      const records = searchData.searchResults || [];
      const total = searchData.totalNumber || 0;

      if (records.length === 0) {
        status.innerHTML = `ℹ️ 周辺1.5km以内に橋梁データは見つかりませんでした。`;
        return;
      }

      status.innerHTML = `✅ ヒット総数: <b>${total}件</b>（周辺 <b>${records.length}橋</b> を描画）<br>丸い点をタップすると点検結果を表示します。`;

      records.forEach((item) => {
        if (!item.lat || !item.lon) return;
        const meta = item.metadata || {};

        const roadName = pickMeta(meta, ["路線", "road", "line"]);
        const adminName = pickMeta(meta, ["管理", "admin", "manager", "事務所", "自治体"]);
        const builtYear = pickMeta(meta, ["架設", "built", "完成", "start", "年"]);
        const length = pickMeta(meta, ["橋長", "length", "延長"]);
        const width = pickMeta(meta, ["幅員", "width"]);
        const inspectYear = pickMeta(meta, ["点検", "inspection"]);
        const judgeRaw = pickMeta(meta, ["判定", "健全", "judge", "区分", "評価"]);

        const style = getJudgeStyle(judgeRaw);

        // 赤丸などのサークルマーカーで地図上にプロット
        const marker = L.circleMarker([item.lat, item.lon], {
          radius: 10,
          fillColor: style.color,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(markersLayer);

        const popupHtml = `
          <div style="min-width:230px;">
            <div class="popup-title" style="border-color:${style.color};">
              ${item.title || "名称未詳"}
            </div>
            <table class="popup-table">
              <tr><th>健全性判定</th><td><b style="color:${style.color};">${style.label}</b></td></tr>
              <tr><th>路線名</th><td>${roadName}</td></tr>
              <tr><th>管理者</th><td>${adminName}</td></tr>
              <tr><th>架設年度</th><td>${builtYear}</td></tr>
              <tr><th>橋長 / 幅員</th><td>${length} m / ${width} m</td></tr>
              <tr><th>最新点検年</th><td>${inspectYear}</td></tr>
              <tr><th>座標</th><td>${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</td></tr>
            </table>
            <details style="margin-top:6px; font-size:11px;">
              <summary style="cursor:pointer; color:#0284c7;">詳細メタデータを表示</summary>
              <pre style="max-height:110px; overflow:auto; background:#f8fafc; padding:4px; margin-top:4px;">${JSON.stringify(meta, null, 2)}</pre>
            </details>
          </div>
        `;
        marker.bindPopup(popupHtml);
      });

    } catch (err) {
      status.innerHTML = "❌ データ取得エラー。APIキーが正しいか確認してください。";
      console.error(err);
    }
  }
</script>
</body>
</html>
