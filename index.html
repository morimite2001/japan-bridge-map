<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鹿児島 橋梁点検マップ (DPF連携)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif; }
    #map { width: 100%; height: 100%; cursor: crosshair; }
    
    /* 操作パネル（スマホ・タブレット対応） */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 14px;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      margin: 0 0 10px 0;
    }
    .btn-gps {
      width: 100%;
      padding: 11px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }
    .btn-gps:hover { background: #0369a1; }
    .btn-gps:active { transform: translateY(1px); }
    .status-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .legend {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
      color: #fff;
    }
    .b-1 { background: #10b981; } /* 判定Ⅰ: 緑 */
    .b-2 { background: #f59e0b; } /* 判定Ⅱ: オレンジ */
    .b-3 { background: #ef4444; } /* 判定Ⅲ: 赤 */
    .b-4 { background: #7f1d1d; } /* 判定Ⅳ: 濃赤 */

    /* ポップアップ内デザイン */
    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin: 0 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #ef4444;
      color: #0f172a;
    }
    .popup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .popup-table th, .popup-table td {
      border: 1px solid #cbd5e1;
      padding: 5px 6px;
      text-align: left;
    }
    .popup-table th {
      background: #f1f5f9;
      width: 38%;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="control-panel">
  <div class="panel-title">🌉 鹿児島 橋梁点検マップ</div>

  <button class="btn-gps" onclick="searchByGPS()">
    📍 現在地（GPS）から周辺20橋を検索
  </button>

  <div id="status" class="status-text">
    現在地ボタンを押すか、地図上の調べたい場所をタップしてください（半径1.5km・周辺20橋を表示）。
  </div>

  <div class="legend">
    <span class="badge b-3">● 判定Ⅲ/Ⅳ(要措置)</span>
    <span class="badge b-2">● 判定Ⅱ(予防保全)</span>
    <span class="badge b-1">● 判定Ⅰ(健全)</span>
  </div>
</div>

<div id="map"></div>

<script>
  // 作成したCloudflare Workersの専用中継URL
  const WORKER_ENDPOINT = "https://tight-block-116a.morimite2001.workers.dev/";
  const SEARCH_RADIUS = 1500.0; // 検索半径 1.5km

  // 初期表示：鹿児島市中心部
  const map = L.map('map', { zoomControl: false }).setView([31.596728, 130.557147], 14);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 地図タイル（国土地理院淡色 ＆ 航空写真 ＆ OpenStreetMap）
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { attribution: '国土地理院' });
  const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: '国土地理院' });
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
  gsiPale.addTo(map);
  L.control.layers({
    "国土地理院(淡色)": gsiPale,
    "航空写真(シームレス)": gsiPhoto,
    "OpenStreetMap": osm
  }, null, { position: 'bottomright' }).addTo(map);

  let markersLayer = L.layerGroup().addTo(map);
  let searchCircle = null;

  // 判定区分に応じたマーカー色を決定
  function getJudgeStyle(judgeStr) {
    const s = String(judgeStr || "");
    if (s.includes("4") || s.includes("Ⅳ") || s.includes("IV")) return { color: "#7f1d1d", label: "判定Ⅳ (緊急措置段階)" };
    if (s.includes("3") || s.includes("Ⅲ") || s.includes("III")) return { color: "#ef4444", label: "判定Ⅲ (早期措置段階)" };
    if (s.includes("2") || s.includes("Ⅱ") || s.includes("II")) return { color: "#f59e0b", label: "判定Ⅱ (予防保全段階)" };
    if (s.includes("1") || s.includes("Ⅰ") || s.includes("I")) return { color: "#10b981", label: "判定Ⅰ (健全)" };
    return { color: "#ef4444", label: s || "記録確認中" }; // 目立つ赤丸を基本色に設定
  }

  // 国土交通DPFの日本語キー・英語キー両方に対応したデータ抽出関数
  function getMetaInfo(meta) {
    if (!meta || typeof meta !== 'object') {
      return { road: "記録なし", admin: "記録なし", year: "記録なし", length: "-", width: "-", inspect: "記録なし", judge: "記録確認中" };
    }

    // DPF橋梁データでよく使われる属性キーを網羅的に探索
    const findVal = (keywords) => {
      for (const [k, v] of Object.entries(meta)) {
        if (v === null || v === "" || typeof v === "object") continue;
        for (const kw of keywords) {
          if (k.toLowerCase().includes(kw.toLowerCase())) return String(v);
        }
      }
      return "記録なし";
    };

    return {
      road: findVal(["路線", "road", "line", "route"]),
      admin: findVal(["管理", "admin", "manager", "事務所", "自治体", "office"]),
      year: findVal(["架設", "完成", "built", "construct", "start"]),
      length: findVal(["橋長", "延長", "length"]),
      width: findVal(["幅員", "width"]),
      inspect: findVal(["点検", "調査", "inspect"]),
      judge: findVal(["判定", "健全", "措置", "区分", "judge", "rank", "eval"])
    };
  }

  // GPS現在地から検索
  function searchByGPS() {
    const status = document.getElementById('status');
    if (!navigator.geolocation) {
      status.innerHTML = "❌ お使いの端末・ブラウザは位置情報に対応していません。";
      return;
    }
    status.innerHTML = "📡 GPS・Wi-Fiから現在地を取得しています...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 15);
        fetchBridges(lat, lon, "現在地（GPS）");
      },
      (err) => {
        status.innerHTML = "❌ 現在地の取得に失敗しました。ブラウザの位置情報許可をONにするか、地図上を直接タップしてください。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // 地図上のクリック・タップで検索
  map.on('click', (e) => {
    fetchBridges(e.latlng.lat, e.latlng.lng, "指定地点");
  });

  async function fetchBridges(lat, lon, label) {
    const status = document.getElementById('status');

    markersLayer.clearLayers();
    if (searchCircle) map.removeLayer(searchCircle);

    // 半径1.5kmのサークルを描画
    searchCircle = L.circle([lat, lon], {
      radius: SEARCH_RADIUS,
      color: '#0284c7',
      weight: 2,
      fillOpacity: 0.08
    }).addTo(map);

    // 中心ピンを立てる
    L.marker([lat, lon]).addTo(markersLayer)
      .bindPopup(`<b>📍 ${label}</b><br>緯度: ${lat.toFixed(5)}<br>経度: ${lon.toFixed(5)}`)
      .openPopup();

    status.innerHTML = `🔄 ${label}から半径1.5km以内の橋梁データを取得中...`;

    const query = `
      query {
        search(
          term: "橋梁"
          locationFilter: {
            geoDistance: {
              lat: ${lat}
              lon: ${lon}
              distance: ${SEARCH_RADIUS}
            }
          }
          first: 0
          size: 20
        ) {
          totalNumber
          searchResults {
            id
            title
            lat
            lon
            metadata
          }
        }
      }
    `;

    try {
      const response = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      if (!response.ok) {
        throw new Error(`HTTP status ${response.status}`);
      }

      const json = await response.json();
      if (json.errors) {
        status.innerHTML = "❌ クエリエラー: " + json.errors[0].message;
        return;
      }

      const searchData = (json.data && json.data.search) || {};
      const records = searchData.searchResults || [];
      const total = searchData.totalNumber || 0;

      if (records.length === 0) {
        status.innerHTML = `ℹ️ 周辺1.5km以内に橋梁データは見つかりませんでした。`;
        return;
      }

      status.innerHTML = `✅ 検索ヒット総数: <b>${total}件</b>（周辺 <b>${records.length}橋</b> を描画）<br>丸い点をタップすると点検結果を表示します。`;

      records.forEach((item) => {
        if (!item.lat || !item.lon) return;
        const meta = item.metadata || {};
        const info = getMetaInfo(meta);
        const style = getJudgeStyle(info.judge);

        // 赤丸・緑丸などのサークルマーカーを描画
        const marker = L.circleMarker([item.lat, item.lon], {
          radius: 10,
          fillColor: style.color,
          color: "#ffffff",
          weight: 2.5,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(markersLayer);

        // すべての登録メタデータを一覧表として展開できるHTMLを作成
        let allMetaRows = "";
        for (const [k, v] of Object.entries(meta)) {
          if (v !== null && v !== "" && typeof v !== "object") {
            allMetaRows += `<tr><th>${k}</th><td>${v}</td></tr>`;
          }
        }

        const popupHtml = `
          <div style="min-width:250px; max-width:320px;">
            <div class="popup-title" style="border-color:${style.color};">
              ${item.title || "名称未詳"}
            </div>
            <table class="popup-table">
              <tr><th>健全性判定</th><td><b style="color:${style.color};">${style.label}</b></td></tr>
              <tr><th>路線名</th><td>${info.road}</td></tr>
              <tr><th>管理者</th><td>${info.admin}</td></tr>
              <tr><th>架設年度</th><td>${info.year}</td></tr>
              <tr><th>橋長 / 幅員</th><td>${info.length} m / ${info.width} m</td></tr>
              <tr><th>最新点検年</th><td>${info.inspect}</td></tr>
              <tr><th>位置座標</th><td>${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</td></tr>
            </table>
            <details style="margin-top:8px; font-size:11px;">
              <summary style="cursor:pointer; color:#0284c7; font-weight:bold;">📋 国交省DPFの全登録項目を見る</summary>
              <div style="max-height:150px; overflow-y:auto; margin-top:4px;">
                <table class="popup-table">${allMetaRows}</table>
              </div>
            </details>
          </div>
        `;
        marker.bindPopup(popupHtml);
      });

    } catch (err) {
      status.innerHTML = "❌ 通信エラーが発生しました: " + err.message;
      console.error(err);
    }
  }
</script>
</body>
</html>
